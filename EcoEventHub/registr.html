<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoEvent Hub | Registrace dobrovolníka</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-leaf me-2"></i>EcoEvent Hub</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Přehled akcí</a></li>
                    <li class="nav-item"><a class="nav-link active" href="registr.html">Registrace dobrovolníka</a></li>
                    <li class="nav-item"><a class="nav-link" href="kontakt.html">Kontakt</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm p-4">
                    <h2 class="h4 text-success mb-3"><i class="fa-solid fa-user-plus me-2"></i>Registrace do dobrovolnického klubu</h2>
                    
                    <form action="#" method="POST">
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Jméno a příjmení</label>
                            <input type="text" class="form-control" id="fullName" placeholder="Jan Novák" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">E-mailová adresa</label>
                            <input type="email" class="form-control" id="email" placeholder="jan@novak.cz" required>
                        </div>

                        
                        <div class="mb-3">
                            <label for="interests" class="form-label">Oblasti zájmu (vyberte jednu nebo více)</label>
                            <select id="interests" name="interests[]" multiple required class="form-select">
                                <option value="" disabled selected>Vyberte zájmy...</option>
                                <option value="sadba">Výsadba stromů a zeleň</option>
                                <option value="uklid">Úklid odpadků a přírody</option>
                                <option value="workshopy">Vzdělávací workshopy</option>
                                <option value="swap">SWAP & Re-use akce</option>
                                <option value="organizace">Organizační pomoc</option>
                            </select>
                            <div class="form-text">Můžete zvolit více možností stisknutím nebo vyhledáváním.</div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 fw-bold"><i class="fa-solid fa-paper-plane me-1"></i> Odeslat registraci</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
    <script>
        new TomSelect("#interests", {
            plugins: ['remove_button'],
            create: false,
            maxItems: 5
        });
    </script>
</body>
</html>
