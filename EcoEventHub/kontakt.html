<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoEvent Hub | Kontakt</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/tinymce@6.8.3/tinymce.min.js"></script>
    <script>
        tinymce.init({
            selector: '#messageEditor',
            height: 250,
            menubar: false,
            plugins: 'lists link image preview',
            toolbar: 'undo redo | bold italic underline | bullist numlist | link'
        });
    </script>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-leaf me-2"></i>EcoEvent Hub</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Přehled akcí</a></li>
                    <li class="nav-item"><a class="nav-link" href="registr.html">Registrace dobrovolníka</a></li>
                    <li class="nav-item"><a class="nav-link active" href="kontakt.html">Kontakt</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm p-4">
                    <h2 class="h4 text-success mb-3"><i class="fa-solid fa-envelope me-2"></i>Kontaktní formulář</h2>
                    
                    <form action="#" method="POST">
                        <div class="mb-3">
                            <label for="contactEmail" class="form-label">Váš E-mail</label>
                            <input type="email" class="form-control" id="contactEmail" placeholder="vas@email.cz" required>
                        </div>

                        <div class="mb-3">
                            <label for="messageEditor" class="form-label">Vaše zpráva / návrh akce</label>
                            <textarea id="messageEditor" name="message">Dobrý den, chtěl bych navrhnout novou akci na úklid lesa...</textarea>
                        </div>

                        <button type="submit" class="btn btn-success w-100 fw-bold"><i class="fa-solid fa-paper-plane me-1"></i> Odeslat zprávu</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
